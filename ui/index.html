<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SPZ Tutorial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root" class="hidden">
    <div id="dim"></div>
    <div id="spot"></div>
    <div id="card">
      <div class="c-head">
        <span id="section" class="chip"></span>
        <span id="count" class="count"></span>
      </div>
      <h1 id="title"></h1>
      <div id="body" class="body"></div>
      <div class="bar"><div id="bar-fill"></div></div>
      <div class="c-foot">
        <button id="exit" class="btn ghost">Skip tour</button>
        <div class="grow"></div>
        <button id="back" class="btn">Back</button>
        <button id="next" class="btn primary">Next</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
